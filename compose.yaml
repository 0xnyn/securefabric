# Production-like stack: slim runtime images, no source mounts.
#   make up        -> postgres + migrate + api + worker
#   make stack     -> same, plus hot reload + Habitat (see compose.dev.yaml)
name: securefabric

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-securefabric}:${POSTGRES_PASSWORD:-securefabric}@postgres:5432/${POSTGRES_DB:-securefabric}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securefabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securefabric}
      POSTGRES_DB: ${POSTGRES_DB:-securefabric}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies db/migrations (incl. the Absurd schema) then exits.
  migrate:
    image: securefabric-api:local
    build: { context: ., target: runtime, args: { APP: api } }
    command: [ "securefabric-migrate" ]
    environment:
      <<: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: securefabric-api:local
    build: { context: ., target: runtime, args: { APP: api } }
    restart: unless-stopped
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_ENVIRONMENT: ${ENVIRONMENT:-local}
      API_LOG_FORMAT: ${LOG_FORMAT:-json}
      API_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    image: securefabric-worker:local
    build: { context: ., target: runtime, args: { APP: worker } }
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      WORKER_ENVIRONMENT: ${ENVIRONMENT:-local}
      WORKER_LOG_FORMAT: ${LOG_FORMAT:-json}
      WORKER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ---- optional tools (profile: tools) -------------------------------------
  habitat:
    profiles: [ tools ]
    build: { context: docker/habitat }
    image: securefabric-habitat:local
    environment:
      HABITAT_DB_URL: postgresql://${POSTGRES_USER:-securefabric}:${POSTGRES_PASSWORD:-securefabric}@postgres:5432/${POSTGRES_DB:-securefabric}?sslmode=disable
      HABITAT_LISTEN: ":7890"
    ports:
      - "127.0.0.1:${HABITAT_PORT:-7890}:7890"
    depends_on:
      migrate: { condition: service_completed_successfully }

  absurdctl:
    profiles: [ tools ]
    build: { context: docker/absurdctl }
    image: securefabric-absurdctl:local
    environment:
      ABSURD_DATABASE_URL: postgresql://${POSTGRES_USER:-securefabric}:${POSTGRES_PASSWORD:-securefabric}@postgres:5432/${POSTGRES_DB:-securefabric}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
