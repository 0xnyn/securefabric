[project]
name = "securefabric-api"
version = "0.1.0"
description = "SecureFabric HTTP API (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "securefabric-core",
    "securefabric-db",
    "securefabric-domain",
    "securefabric-tasks",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
securefabric-api = "securefabric_api.__main__:main"
securefabric-openapi = "securefabric_api.openapi:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
securefabric-core = { workspace = true }
securefabric-tasks = { workspace = true }
securefabric-db = { workspace = true }
securefabric-domain = { workspace = true }
