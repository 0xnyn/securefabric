# The pnpm half of the monorepo. Python members (apps/api, apps/worker,
# packages/{core,db,tasks}) also carry a thin package.json so Turborepo can
# schedule, cache and order their lint/typecheck/test tasks next to the
# TypeScript ones; their real dependencies live in pyproject.toml + uv.lock.
packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@parcel/watcher": true
  keytar: false

catalog:
  zod: ^4.6.7
  typescript: ^6.0.3
  "@types/node": ^26.6.6
  lucide-react: ^1.70.0
  next-themes: ^0.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  sonner: ^2.0.8
  "@tailwindcss/postcss": ^4.3.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.5
  vitest: 4.1.10
