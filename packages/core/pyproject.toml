[project]
name = "securefabric-core"
version = "0.1.0"
description = "Shared building blocks (settings, logging, errors, ids, clock, canonical hashing, vault crypto) for SecureFabric services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=26.1.0",
    "pynacl>=1.6",
    "cryptography>=46",
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10"]
build-backend = "uv_build"
