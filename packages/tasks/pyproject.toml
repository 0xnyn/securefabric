[project]
name = "securefabric-tasks"
version = "0.1.0"
description = "Durable task contracts and Absurd client wiring shared by SecureFabric services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absurd-sdk>=0.5.1",
    "pydantic>=2.14",
    "securefabric-core",
    "securefabric-db",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
securefabric-core = { workspace = true }
securefabric-db = { workspace = true }
